packages:
  - 'configs/*'
  - 'cli/*'

allowBuilds:
  '@playwright/browser-chromium': false
  '@swc/core': false
  core-js: false
  esbuild: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@swc/core-darwin-arm64@1.15.43'
  - '@swc/core-darwin-x64@1.15.43'
  - '@swc/core-linux-arm-gnueabihf@1.15.43'
  - '@swc/core-linux-arm64-gnu@1.15.43'
  - '@swc/core-linux-arm64-musl@1.15.43'
  - '@swc/core-linux-ppc64-gnu@1.15.43'
  - '@swc/core-linux-s390x-gnu@1.15.43'
  - '@swc/core-linux-x64-gnu@1.15.43'
  - '@swc/core-linux-x64-musl@1.15.43'
  - '@swc/core-win32-arm64-msvc@1.15.43'
  - '@swc/core-win32-ia32-msvc@1.15.43'
  - '@swc/core-win32-x64-msvc@1.15.43'
  - '@swc/core@1.15.43'
  - browserslist@4.28.4

overrides:
  '@babel/core': '>=7.29.6'
  '@tootallnate/once': '>=2.0.1'
  'axios@>=1.0.0 <1.16.0': '>=1.16.0'
  'body-parser@<1.20.6': '>=1.20.6'
  'brace-expansion@<1.1.16': '^1.1.16'
  'brace-expansion@^2.0.0': '^2.1.2'
  'brace-expansion@>=3.0.0 <5.0.7': '>=5.0.7'
  'cookie@<0.7.0': '>=0.7.0'
  'degit@<2.8.6': '>=2.8.6'
  'diff@>=5.0.0 <5.2.2': '>=5.2.2'
  'fast-uri@>=3.0.0 <=3.1.3': '>=3.1.4'
  'joi': '>=17.13.4'
  'js-yaml': '>=4.2.0'
  'js-yaml@^4.0.0': '^4.3.0'
  'linkify-it@<=5.0.1': '>=5.0.2'
  'markdown-it': '>=14.2.0'
  'picomatch': '>=2.3.2'
  'postcss@<=8.5.17': '>=8.5.18'
  'qs@>=6.7.0 <=6.14.1': '>=6.14.2'
  'ws@>=8.0.0 <8.21.0': '>=8.21.0'
