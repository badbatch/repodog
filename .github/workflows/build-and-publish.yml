name: Build and publish

on:
  push:
    branches:
      - main
    tags:
      - v**
  pull_request:
    branches:
      - main

jobs:
  build-and-publish:
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/master-build-and-publish.yml
    secrets:
      npm_auth_token: ${{ secrets.NPM_AUTH_TOKEN }}
