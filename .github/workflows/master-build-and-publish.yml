name: Repodog build and publish

on:
  workflow_call:
    inputs:
      package-manager:
        default: 'pnpm'
        required: false
        type: string
    secrets:
      NPM_AUTH_TOKEN:
        required: false

jobs:
  build-and-publish:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Log build trigger
        run: |
          echo ${{ github.ref }}
          echo ${{ github.ref_type }}

      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.local/share/mise/shims" >> $GITHUB_PATH
          mise install

      - name: Install dependencies with pnpm
        if: inputs.package-manager == 'pnpm'
        run: pnpm install

      - name: Install dependencies with yarn
        if: inputs.package-manager == 'yarn'
        run: yarn install

      - name: Install dependencies with npm
        if: inputs.package-manager == 'npm'
        run: npm install

      - name: Lint dependencies
        run: npm run --if-present syncpack

      - name: Build code
        run: NODE_ENV=production npm run --if-present build

      - name: Format code
        run: npm run --if-present format

      - name: Lint code
        run: npm run --if-present lint

      - name: Type check code
        run: npm run --if-present type-check

      - name: Run unit tests
        run: npm run --if-present test

      - name: Publish packages
        if: github.ref_type == 'tag'
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: |
          npm run --if-present repodog -- publish --verbose
